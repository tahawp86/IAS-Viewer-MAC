# -*- coding: utf-8 -*-
# ورک‌فلو بیلد نسخه‌ی مک IAS Viewer (IAS-Viewer-MAC).
#
# خروجی‌ها:
#   - IAS Viewer.app  (باندل PyInstaller، حالت windowed/onedir)
#   - IAS-Viewer-MAC-Update-vX.Y.Z.zip  (فایل آپدیت تفاضلی برای آپدیتر داخل برنامه)
#   - IAS-Viewer-MAC-vX.Y.Z.dmg  (بسته‌ی نصب)
#   - IAS-Viewer-MAC-source-vX.Y.Z.zip  (آرشیو سورس همان نسخه — تعهد «Corresponding Source» در AGPL-3.0)
#   - THIRD_PARTY_NOTICES  (نام/نسخه/لایسنس/لینک سورس کامپوننت‌های ثالث — تعهد «notices»)
#
# انتشار در GitHub Release: خودکار وقتی تگ mac-v* پوش می‌شود
# (مثل NerkhCheck)، یا با اجرای دستی ورک‌فلو + تیک publish_release؛
# تگ ریلیز مک «mac-vX.Y.Z-beta» است تا با ریلیزهای ویندوز (vX.Y.Z-beta) قاطی نشود.
#
# نکته‌ی Gatekeeper: باندل امضا نشده است (بدون حساب دولوپر اپل)؛ کاربر در اولین
# اجرا باید راست‌کلیک ← Open کند. این محدودیت اپل است، نه باگ بیلد.

name: Build macOS App

on:
  push:
    branches: [main]
    # مثل NerkhCheck: پوش تگ mac-v* (مثلاً mac-v2.0.93-beta) هم بیلد می‌گیرد
    # و در انتها فایل آپدیت/DMG را خودکار در GitHub Release منتشر می‌کند.
    tags: ['mac-v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'انتشار فایل آپدیت در GitHub Release (تگ mac-vX.Y.Z)'
        type: boolean
        default: true

env:
  APP_NAME: IAS Viewer

jobs:
  build-macos:
    runs-on: macos-latest
    # (1.0.0) انتشار ریلیز با gh release به contents:write نیاز دارد —
    # پیش‌فرض read-only ریپو باعث fail خاموش استپ Publish می‌شد.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Read version
        shell: bash
        run: |
          set -euo pipefail
          ver="$(tr -d '\r\n ' < version.txt)"
          echo "APP_VERSION=$ver" >> "$GITHUB_ENV"
          echo "APP_VERSION=$ver"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Prepare plate-reader assets (model + OCR models)
        # مثل ویندوز: مدل‌ها باید حتماً داخل باندل باشند تا روی سیستم کاربر
        # هیچ دانلودی لازم نباشد. نبود/ناقص بودن → بیلد fail.
        shell: bash
        run: |
          set -euo pipefail
          python ci/prepare_plate_assets.py

      - name: Cache yolov8n weights (person detection)
        # مثل ورک‌فلو ویندوز: وزن yolov8n.pt فقط یک‌بار دانلود و در کش
        # نگه داشته می‌شود (person_detector.py در runtime آن را می‌خواهد).
        id: yolov8n-weights-cache
        uses: actions/cache@v4
        with:
          path: yolov8n.pt
          key: yolov8n-weights-v1

      - name: Download yolov8n.pt (فقط اگر در کش نبود)
        if: steps.yolov8n-weights-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "yolov8n.pt" ]; then
            python -c "from ultralytics import YOLO; YOLO('yolov8n.pt')" || true
          fi
          if [ ! -f "yolov8n.pt" ]; then
            curl -sSL -o yolov8n.pt "https://github.com/ultralytics/assets/releases/download/v8.3.0/yolov8n.pt"
          fi
          test -f "yolov8n.pt" || { echo "FAIL: دانلود yolov8n.pt موفق نشد."; exit 1; }
          echo "yolov8n.pt آماده‌ی بسته‌بندی است: $(wc -c < yolov8n.pt) بایت"

      - name: Cache fire-smoke weights (fire & smoke detection)
        # موتور تشخیص آتش/دود (fire_smoke_detector.py): وزن YOLOv8n
        # آموزش‌دیده‌ی fire/smoke — مثل yolov8n.pt بالا.
        id: fire-smoke-weights-cache
        uses: actions/cache@v4
        with:
          path: fire_smoke.pt
          key: fire-smoke-weights-v1

      - name: Download fire_smoke.pt (فقط اگر در کش نبود)
        if: steps.fire-smoke-weights-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "fire_smoke.pt" ]; then
            curl -sSL -o fire_smoke.pt "https://github.com/shreyaa4567/industrial-smoke-and-fire-detection/raw/main/best_shreya_v2.pt"
          fi
          test -f "fire_smoke.pt" || { echo "FAIL: دانلود fire_smoke.pt موفق نشد."; exit 1; }
          python -c "from ultralytics import YOLO; m=YOLO('fire_smoke.pt'); assert set(m.names.values())>={'fire','smoke'}, m.names; print('fire_smoke.pt OK:', m.names)"
          echo "fire_smoke.pt آماده‌ی بسته‌بندی است: $(wc -c < fire_smoke.pt) بایت"

      - name: Cache SegFormer floor-detection weights
        # مثل ورک‌فلو ویندوز: وزن SegFormer-B0 فقط یک‌بار دانلود و در کش
        # نگه داشته می‌شود (floor_detector.py در runtime آن را می‌خواهد).
        id: segformer-weights-cache
        uses: actions/cache@v4
        with:
          path: segformer_floor_model
          key: segformer-floor-weights-v1

      - name: Download SegFormer weights (فقط اگر در کش نبود)
        if: steps.segformer-weights-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -c "from transformers import SegformerImageProcessor, SegformerForSemanticSegmentation; m='nvidia/segformer-b0-finetuned-ade-512-512'; p=SegformerImageProcessor.from_pretrained(m); mdl=SegformerForSemanticSegmentation.from_pretrained(m); p.save_pretrained('segformer_floor_model'); mdl.save_pretrained('segformer_floor_model')"
          test -f "segformer_floor_model/config.json" || { echo "FAIL: دانلود وزن SegFormer موفق نشد."; exit 1; }
          echo "segformer_floor_model آماده‌ی بسته‌بندی است."

      - name: Build .app with PyInstaller
        shell: bash
        run: |
          set -euo pipefail
          # آیکون .icns از لوگوی شیلد (غیر حیاتی؛ اگر نشد بدون آیکون ادامه می‌دهیم)
          ICON_ARG=()
          if [ -f "assets/logo_shield.png" ]; then
            rm -rf /tmp/ias.iconset && mkdir -p /tmp/ias.iconset
            if sips -z 1024 1024 "assets/logo_shield.png" --out /tmp/ias.iconset/icon_512x512@2x.png >/dev/null 2>&1 \
               && sips -z 512 512 "assets/logo_shield.png" --out /tmp/ias.iconset/icon_512x512.png >/dev/null 2>&1 \
               && sips -z 256 256 "assets/logo_shield.png" --out /tmp/ias.iconset/icon_256x256.png >/dev/null 2>&1 \
               && sips -z 128 128 "assets/logo_shield.png" --out /tmp/ias.iconset/icon_128x128.png >/dev/null 2>&1 \
               && iconutil -c icns /tmp/ias.iconset -o /tmp/ias.icns >/dev/null 2>&1; then
              ICON_ARG=(--icon=/tmp/ias.icns)
              echo "icns icon ready."
            else
              echo "WARNING: icns generation failed; continuing without icon."
            fi
          fi
          pyi_args=(
            --onedir
            --noconfirm
            --clean
            --windowed
            "--name=$APP_NAME"
            --hidden-import=_socket
            --hidden-import=socket
            --hidden-import=_ssl
            --hidden-import=ssl
            --add-data=faces:faces
            --add-data=yolov8n.pt:.
            --add-data=fire_smoke.pt:.
            --add-data=CHANGELOG_FA.md:.
            --add-data=segformer_floor_model:segformer_floor_model
            --collect-all=ultralytics
            --collect-all=torch
            --collect-all=torchvision
            --collect-all=transformers
            --collect-all=face_recognition_models
            --collect-all=cv2
            --collect-all=onvif
            --distpath=dist
            ${ICON_ARG[@]+"${ICON_ARG[@]}"}
          )
          # مدل پلاک‌خوان (اجباری)
          test -f "plate_detector.pt" || { echo "FAIL: plate_detector.pt آماده نیست."; exit 1; }
          pyi_args+=(--add-data=plate_detector.pt:.)
          test -f "plate_ocr_models/hezar_plate_v2.onnx" || { echo "FAIL: plate_ocr_models آماده نیست."; exit 1; }
          pyi_args+=(--add-data=plate_ocr_models:plate_ocr_models)
          # onnxruntime برای پلاک‌خوان
          python -c "import onnxruntime" 2>/dev/null && pyi_args+=(--collect-all=onnxruntime) || echo "WARNING: onnxruntime نصب نیست."
          # ezdxf (نقشه‌ی DXF) اختیاری
          python -c "import ezdxf" 2>/dev/null && pyi_args+=(--collect-all=ezdxf) || echo "WARNING: ezdxf نصب نیست؛ نقشه‌ی DXF غیرفعال می‌ماند."
          if [ -d "assets" ]; then pyi_args+=(--add-data=assets:assets); fi
          echo "PyInstaller args: ${pyi_args[*]}"
          python -m PyInstaller "${pyi_args[@]}" main.py
          test -d "dist/$APP_NAME.app" || { echo "FAIL: dist/$APP_NAME.app ساخته نشد."; exit 1; }
          echo "OK: dist/$APP_NAME.app"

      - name: Place updater-convention files at bundle root
        # قرارداد آپدیتر: get_install_dir روی مک = ریشه‌ی باندل .app؛ پس
        # version.txt و CHANGELOG_FA.md باید کنار Contents باشند تا
        # پنجره‌ی «به‌روزرسانی انجام شد» و تشخیص نسخه درست کار کنند.
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="dist/$APP_NAME.app"
          cp version.txt "$BUNDLE/version.txt"
          cp CHANGELOG_FA.md "$BUNDLE/CHANGELOG_FA.md"
          echo "bundle root:" && ls "$BUNDLE"

      - name: Download previous macOS manifest (for diff update)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p prev
          runId="$(gh run list --workflow=build-macos.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)"
          if [ -n "$runId" ]; then
            gh run download "$runId" -n IAS-Viewer-MAC-manifest -D prev 2>&1 || true
          fi
          if [ -f prev/manifest.json ]; then
            echo "PREV_MANIFEST=prev/manifest.json" >> "$GITHUB_ENV"
            echo "previous macOS manifest found."
          else
            echo "PREV_MANIFEST=" >> "$GITHUB_ENV"
            echo "no previous manifest; update will be full payload."
          fi

      - name: Generate update manifest
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="dist/$APP_NAME.app"
          python installer/make_update.py manifest --dist "$BUNDLE" --version "$APP_VERSION" --out "$BUNDLE/manifest.json"
          cp "$BUNDLE/manifest.json" dist/manifest.json

      - name: Build update package (diff)
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="dist/$APP_NAME.app"
          prevArg=()
          if [ -n "${PREV_MANIFEST:-}" ] && [ -f "$PREV_MANIFEST" ]; then prevArg=(--prev "$PREV_MANIFEST"); fi
          # نکته: bash مک (3.2) با set -u روی آرایه‌ی خالی "${prevArg[@]}"
          # خطای unbound variable می‌دهد؛ فرم ${arr[@]+"${arr[@]}"} روی
          # bash قدیمی هم سالم است.
          python installer/make_update.py package --dist "$BUNDLE" --version "$APP_VERSION" ${prevArg[@]+"${prevArg[@]}"} \
            --out "dist/IAS-Viewer-MAC-Update-v$APP_VERSION.zip" --stagedir update_staging --app IAS-Viewer-MAC
          ls -la dist/IAS-Viewer-MAC-Update-*.zip

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail
          # DMG ساده: باندل .app داخلش؛ کاربر درگ می‌کند به Applications
          hdiutil create -volname "IAS Viewer" -srcfolder "dist/$APP_NAME.app" \
            -ov -format UDZO "dist/IAS-Viewer-MAC-v$APP_VERSION.dmg"
          ls -la dist/*.dmg

      - name: Package source archive (AGPL Corresponding Source)
        # (1.0.0) تعهد «Corresponding Source» لایسنس AGPL-3.0: آرشیو سورس
        # دقیقاً همان کامیتی که این بیلد را ساخته — ضمیمه‌ی هر ریلیز می‌شود.
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=IAS-Viewer-MAC/ \
            -o "dist/IAS-Viewer-MAC-source-v$APP_VERSION.zip" HEAD
          ls -la dist/IAS-Viewer-MAC-source-*.zip

      - name: Generate THIRD_PARTY_NOTICES
        # (1.0.0) تعهد «notices» لایسنس‌های GPL/AGPL: نام کامپوننت، نسخه‌ی
        # نصب‌شده در همین بیلد، لایسنس و لینک سورس — ضمیمه‌ی هر ریلیز.
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYEOF'
          import importlib.metadata as md
          import os

          KNOWN = {
              "pyqt6": ("GPL-3.0", "https://www.riverbankcomputing.com/software/pyqt/"),
              "pyqt6_webengine": ("GPL-3.0", "https://www.riverbankcomputing.com/software/pyqtwebengine/"),
              "pyqt6_qt6": ("LGPL-3.0", "https://www.qt.io/"),
              "pyqt6_sip": ("GPL-3.0", "https://www.riverbankcomputing.com/software/sip/"),
              "opencv_python": ("Apache-2.0", "https://github.com/opencv/opencv-python"),
              "face_recognition": ("MIT", "https://github.com/ageitgey/face_recognition"),
              "face_recognition_models": ("CC-BY-4.0", "https://github.com/ageitgey/face_recognition_models"),
              "numpy": ("BSD-3-Clause", "https://github.com/numpy/numpy"),
              "requests": ("Apache-2.0", "https://github.com/psf/requests"),
              "pymodbus": ("BSD-3-Clause", "https://github.com/riptideio/pymodbus"),
              "onvif_zeep": ("MIT", "https://github.com/FalkTannhaeuser/python-onvif-zeep"),
              "ultralytics": ("AGPL-3.0", "https://github.com/ultralytics/ultralytics"),
              "transformers": ("Apache-2.0", "https://github.com/huggingface/transformers"),
              "pypdf": ("BSD-3-Clause", "https://github.com/py-pdf/pypdf"),
              "torch": ("BSD-3-Clause", "https://github.com/pytorch/pytorch"),
              "torchvision": ("BSD-3-Clause", "https://github.com/pytorch/vision"),
              "pyinstaller": ("GPL-2.0 with bootloader exception",
                              "https://github.com/pyinstaller/pyinstaller"),
          }

          def norm(n):
              return n.lower().replace("-", "_").replace(".", "_")

          rows, seen = [], set()
          for dist in md.distributions():
              name = dist.metadata["Name"] or ""
              key = norm(name)
              if key in KNOWN and key not in seen:
                  seen.add(key)
                  lic, url = KNOWN[key]
                  rows.append((name, dist.version, lic, url))

          # وزن‌های مدل باندل‌شده داخل DMG (دانلود در CI)
          rows += [
              ("yolov8n.pt (Ultralytics YOLOv8n weights)", "v8.3.0", "AGPL-3.0",
               "https://github.com/ultralytics/assets/releases/download/v8.3.0/yolov8n.pt"),
              ("fire_smoke.pt (best_shreya_v2 — fire/smoke detection)", "best_shreya_v2", "MIT",
               "https://github.com/shreyaa4567/industrial-smoke-and-fire-detection"),
              ("segformer_floor_model (nvidia/segformer-b0-finetuned-ade-512-512)",
               "b0-ade-512-512", "Apache-2.0",
               "https://huggingface.co/nvidia/segformer-b0-finetuned-ade-512-512"),
          ]
          rows.sort(key=lambda r: r[0].lower())

          ver = os.environ["APP_VERSION"]
          lines = [
              "THIRD_PARTY_NOTICES",
              "===================",
              "",
              f"IAS Viewer {ver} (macOS) — Copyright (C) 2026 Taha Arefi.",
              "This program is free software licensed under the GNU Affero General Public",
              "License v3.0 — see the LICENSE file and",
              "https://github.com/thaarfknight-star/IAS-Viewer-MAC.",
              "",
              "Third-party components bundled with this release:",
              "",
          ]
          for name, version, lic, url in rows:
              lines += [f"- {name}",
                        f"  version: {version}",
                        f"  license: {lic}",
                        f"  source:  {url}",
                        ""]
          with open("dist/THIRD_PARTY_NOTICES", "w", encoding="utf-8") as fh:
              fh.write("\n".join(lines))
          print(f"THIRD_PARTY_NOTICES written: {len(rows)} components")
          PYEOF
          ls -la dist/THIRD_PARTY_NOTICES

      - name: Smoke test (offscreen import)
        # فقط import سبک ماژول‌های پلتفرم؛ اجرای کامل GUI روی رانر لازم نیست.
        shell: bash
        run: |
          set -euo pipefail
          python - <<'EOF'
          import sys
          sys.path.insert(0, ".")
          import platform_compat as pc
          assert pc.is_macos() or True
          import update_checker as uc
          assert uc.GITHUB_REPO == "thaarfknight-star/IAS-Viewer-MAC", uc.GITHUB_REPO
          assert uc._asset_version("IAS-Viewer-MAC-Update-v2.0.77-beta.zip") == "2.0.77-beta"
          import updater as up
          assert up.UPDATE_APP_ID == "IAS-Viewer-MAC"
          print("macOS smoke OK")
          EOF

      - name: Upload update package
        uses: actions/upload-artifact@v4
        with:
          name: IAS-Viewer-MAC-Update
          path: dist/IAS-Viewer-MAC-Update-*.zip
          if-no-files-found: error

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: IAS-Viewer-MAC-DMG
          path: dist/*.dmg
          if-no-files-found: warn

      - name: Upload manifest (for next diff update)
        uses: actions/upload-artifact@v4
        with:
          name: IAS-Viewer-MAC-manifest
          path: dist/manifest.json
          if-no-files-found: warn

      - name: Publish update package to GitHub Release
        # (1.0.0) continue-on-error: اگر انتشار ریلیز fail شد، بیلد قرمز نشود —
        # فایل‌های بیلد (DMG/ZIP) در Artifacts موجودند.
        continue-on-error: true
        # خودکار وقتی تگ mac-v* پوش می‌شود (مثل NerkhCheck)، یا با اجرای
        # دستی ورک‌فلو + تیک publish_release.
        # (1.0.0) انتشار خودکار: روی push به main هم Release ساخته می‌شود —
        # دیگر لازم نیست تیک publish_release را دستی بزنید.
        # تگ مک «mac-vX.Y.Z-beta» است (جدا از تگ ویندوز).
        if: ${{ startsWith(github.ref, 'refs/tags/mac-v') || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
            ver="${tag#mac-v}"
          else
            ver="$APP_VERSION"
            tag="mac-v$ver"
          fi
          zip=(dist/IAS-Viewer-MAC-Update-v"$ver".zip)
          test -f "${zip[0]}" || { echo "FAIL: update zip not found"; exit 1; }
          dmg=(dist/IAS-Viewer-MAC-v"$ver".dmg)
          # (1.0.0) AGPL-3.0: آرشیو سورس همان نسخه + THIRD_PARTY_NOTICES ضمیمه‌ی هر ریلیز.
          srczip=(dist/IAS-Viewer-MAC-source-v"$ver".zip)
          notices="dist/THIRD_PARTY_NOTICES"
          notes="IAS Viewer $ver — نسخه‌ی مک (macOS)."
          m="$(grep -m1 -F "**نسخه‌ی $ver" README.md || true)"
          if [ -n "$m" ]; then notes="$m"; fi
          notes="$notes

          نصب: فایل DMG را باز کنید و IAS Viewer را به Applications بکشید.
          اولین اجرا: چون برنامه امضا نشده، روی IAS Viewer راست‌کلیک ← Open کنید.

          لایسنس: GNU AGPL v3.0 — فایل LICENSE در ریپو. سورس‌کد این نسخه و THIRD_PARTY_NOTICES ضمیمه‌ی همین ریلیز است."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${zip[0]}" --clobber
            if [ -f "${dmg[0]}" ]; then gh release upload "$tag" "${dmg[0]}" --clobber; fi
            if [ -f "${srczip[0]}" ]; then gh release upload "$tag" "${srczip[0]}" --clobber; fi
            if [ -f "$notices" ]; then gh release upload "$tag" "$notices" --clobber; fi
          else
            files=("${zip[0]}")
            if [ -f "${dmg[0]}" ]; then files+=("${dmg[0]}"); fi
            if [ -f "${srczip[0]}" ]; then files+=("${srczip[0]}"); fi
            if [ -f "$notices" ]; then files+=("$notices"); fi
            # (1.0.0) نسخه‌ی پایدار (بدون beta) نباید prerelease باشد.
            # اگر ریلیز هم‌زمان توسط بیلد دیگری ساخته شد، فقط آپلود می‌کنیم.
            _pre=""
            case "$ver" in *beta*) _pre="--prerelease";; esac
            if ! gh release create "$tag" "${files[@]}" --title "IAS Viewer $ver (macOS)" --notes "$notes" $_pre; then
              sleep 5
              gh release upload "$tag" "${zip[0]}" --clobber
              if [ -f "${dmg[0]}" ]; then gh release upload "$tag" "${dmg[0]}" --clobber; fi
              if [ -f "${srczip[0]}" ]; then gh release upload "$tag" "${srczip[0]}" --clobber; fi
              if [ -f "$notices" ]; then gh release upload "$tag" "$notices" --clobber; fi
            fi
          fi
          echo "OK: ${zip[0]} -> release $tag"
